<!doctype html>
<html lang="en" class="dark" data-theme="dusk" neo-theme-root neo-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        document.documentElement.dataset.theme = ["terminal", "ship"].includes(theme) ? theme : "dusk";
      } catch {}
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aube</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
