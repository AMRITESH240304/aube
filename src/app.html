<!doctype html>
<html lang="en" class="dark" data-theme="haunted" neo-theme-root neo-theme="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "glass") localStorage.setItem("glass", "on");
        document.documentElement.dataset.theme = theme && theme !== "glass" ? theme : "haunted";
        document.documentElement.toggleAttribute("data-glass", localStorage.getItem("glass") === "on");
      } catch {}
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aube</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
